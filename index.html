<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimiento de Aliados - Puebla Comparte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7fa; color: #1e293b; }
        .ally-card { background: white; border-radius: 1.25rem; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .phase-box { flex: 1; text-align: center; padding: 10px 5px; border-radius: 12px; font-size: 0.65rem; border: 1px solid #e5e7eb; transition: all 0.3s; }
        .phase-complete { background-color: #ecfdf5; color: #059669; border-color: #10b981; }
        .phase-active { background-color: #eff6ff; color: #2563eb; border: 2px solid #3b82f6; font-weight: 700; }
        .phase-pending { background-color: #f9fafb; color: #9ca3af; }
        .note-item { background: #ffffff; border-left: 4px solid #3b82f6; padding: 10px; margin-top: 8px; font-size: 0.75rem; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4 md:p-10 max-w-2xl mx-auto">

    <header class="mb-8 text-center">
        <h1 class="text-4xl font-extrabold text-slate-800 tracking-tight">🤝 Captación de Aliados</h1>
        <p class="text-sm text-slate-500 mt-2 italic font-medium">Historial y Prospección de Alianzas</p>
    </header>

    <button onclick="exportarExcel()" class="w-full mb-8 bg-green-600 text-white font-bold py-3 rounded-2xl hover:bg-green-700 transition flex items-center justify-center gap-2 shadow-lg">
        📥 Descargar Reporte con Enlaces (.csv)
    </button>

    <div class="bg-white p-6 rounded-3xl border border-slate-200 mb-10 shadow-sm">
        <h2 class="text-xl font-bold text-blue-700 mb-5 flex items-center gap-2">
            <span class="bg-blue-100 p-2 rounded-lg">➕</span> Nuevo Prospecto
        </h2>
        <form id="ally-form" class="space-y-4">
            <input type="text" id="name" placeholder="Institución / Empresa" class="w-full p-4 border rounded-2xl outline-none focus:ring-2 focus:ring-blue-400 bg-slate-50" required>
            <div class="grid grid-cols-2 gap-4">
                <select id="method" class="p-4 border rounded-2xl bg-slate-50 outline-none">
                    <option value="Visita/Carta">Visita/Carta</option>
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="Llamada">Llamada</option>
                    <option value="Correo">Correo</option>
                </select>
                <input type="text" id="sector" placeholder="Sector (Ej: Educativo)" class="p-4 border rounded-2xl bg-slate-50 outline-none focus:ring-2 focus:ring-blue-400">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl hover:bg-blue-700 transition text-lg shadow-md">
                Iniciar Invitación
            </button>
        </form>
    </div>

    <div id="ally-list" class="space-y-8"></div>

    <script>
        const STEPS = ['Invitación', 'Seguimiento', 'Cierre'];
        let allies = JSON.parse(localStorage.getItem('aliados_pro_final_v4')) || [];

        document.getElementById('ally-form').onsubmit = (e) => {
            e.preventDefault();
            const newAlly = {
                id: Date.now(),
                name: document.getElementById('name').value,
                method: document.getElementById('method').value,
                sector: document.getElementById('sector').value || 'No definido',
                currentStatus: 'Invitación',
                history: { 'Invitación': new Date().toLocaleString() },
                notes: [],
                finalResult: null
            };
            allies.unshift(newAlly);
            save();
            e.target.reset();
        };

        function addNote(id) {
            const txt = prompt("📝 Bitácora: ¿Qué sucedió en este seguimiento?");
            if (txt) {
                const a = allies.find(x => x.id === id);
                a.notes.push({ date: new Date().toLocaleString(), text: txt });
                a.currentStatus = 'Seguimiento';
                if (!a.history['Seguimiento']) a.history['Seguimiento'] = new Date().toLocaleString();
                save();
            }
        }

        function finalize(id) {
            const a = allies.find(x => x.id === id);
            const success = confirm("🌟 ¡Felicidades por la reunión o recorrido! ¿Se logró concretar la alianza?");
            
            if (success) {
                const url = prompt("✅ ¡Excelente! Pega aquí el enlace de los acuerdos compartidos (Drive/Dropbox):");
                a.finalResult = { success: true, detail: url || 'Sin enlace', charla: confirm("¿Se requiere impartir charla?") ? 'Sí' : 'No' };
            } else {
                a.finalResult = { success: false, detail: prompt("¿Hubo alguna dificultad o motivo del sector que no lo permitió?") };
            }
            
            a.currentStatus = 'Cierre';
            a.history['Cierre'] = new Date().toLocaleString();
            save();
        }

        function exportarExcel() {
            if (allies.length === 0) return alert("Sin datos");
            let csv = "\uFEFFNombre,Sector,Medio,Estado,Invitacion,Seguimiento,Cierre,Resultado,Enlace Acuerdos\n";
            allies.forEach(a => {
                const res = a.finalResult ? (a.finalResult.success ? 'ALIADO' : 'RECHAZADO') : 'PROCESO';
                const link = a.finalResult?.success ? a.finalResult.detail : 'N/A';
                csv += `"${a.name}","${a.sector}","${a.method}","${a.currentStatus}","${a.history['Invitación']}","${a.history['Seguimiento'] || ''}","${a.history['Cierre'] || ''}","${res}","${link}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Reporte_Aliados_${new Date().toLocaleDateString()}.csv`;
            link.click();
        }

        function save() {
            localStorage.setItem('aliados_pro_final_v4', JSON.stringify(allies));
            render();
        }

        function render() {
            const container = document.getElementById('ally-list');
            container.innerHTML = '<h2 class="text-2xl font-bold text-slate-800 mb-6">Historial de Prospectos</h2>';

            allies.forEach(a => {
                const isFinal = a.currentStatus === 'Cierre';
                container.innerHTML += `
                    <div class="ally-card p-6 mb-6">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-bold text-slate-800">${a.name}</h3>
                                <p class="text-xs text-slate-400 font-bold uppercase mt-1 tracking-wider">Sector: ${a.sector} • via ${a.method}</p>
                            </div>
                            <span class="text-[10px] font-bold px-3 py-1 rounded-full ${a.finalResult?.success ? 'bg-green-100 text-green-700 border border-green-200' : 'bg-blue-100 text-blue-700 border border-blue-200'} uppercase">
                                ${a.currentStatus}
                            </span>
                        </div>

                        <div class="flex gap-2 mb-6">
                            ${STEPS.map(s => {
                                let style = a.history[s] ? "phase-complete" : (a.currentStatus === s ? "phase-active" : "phase-pending");
                                return `
                                    <div class="phase-box ${style}">
                                        <div class="font-bold uppercase">${s}</div>
                                        <div class="text-[9px] mt-1 opacity-80">${a.history[s] ? a.history[s].split(',')[0] : '--/--/--'}</div>
                                    </div>`;
                            }).join('')}
                        </div>

                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 mb-5 max-h-40 overflow-y-auto shadow-inner">
                            <p class="text-[10px] font-extrabold text-slate-400 uppercase mb-2">Historial de Seguimiento:</p>
                            ${a.notes.length ? a.notes.map(n => `<div class="note-item"><b>${n.date.split(',')[1]}:</b> ${n.text}</div>`).join('') : '<p class="text-xs italic text-slate-400">Sin notas aún.</p>'}
                        </div>

                        ${isFinal ? `
                            <div class="p-4 rounded-2xl border ${a.finalResult.success ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                                ${a.finalResult.success ? 
                                    `<b>🎉 ALIADO CONFIRMADO</b><br><span class="text-xs">Charla: ${a.finalResult.charla}</span><br>
                                     <a href="${a.finalResult.detail}" target="_blank" class="text-blue-600 underline text-xs font-bold mt-2 inline-block">🔗 VER ACUERDOS COMPARTIDOS</a>` : 
                                    `<b>Dificultad reportada:</b><br><span class="text-xs italic">${a.finalResult.detail}</span>`}
                            </div>
                        ` : `
                            <div class="grid grid-cols-2 gap-3">
                                <button onclick="addNote(${a.id})" class="border-2 border-blue-600 text-blue-600 font-bold py-3 rounded-xl text-sm hover:bg-blue-50 transition">📝 Seguimiento</button>
                                <button onclick="finalize(${a.id})" class="bg-slate-800 text-white font-bold py-3 rounded-xl text-sm hover:bg-slate-900 transition">🏁 Finalizar</button>
                            </div>
                        `}
                    </div>`;
            });
        }
        render();
    </script>
</body>
</html>
