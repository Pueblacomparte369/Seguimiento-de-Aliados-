<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer Contacto - Control Ejecutivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .executive-card { background: white; border-radius: 1.25rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid #e2e8f0; }
        .card-alert { border: 2px solid #ef4444; box-shadow: 0 0 15px rgba(239, 68, 68, 0.1); animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { border-color: #ef4444; } 50% { border-color: #fca5a5; } 100% { border-color: #ef4444; } }
        .btn-gradient { background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%); }
    </style>
</head>
<body class="p-4 md:p-8 max-w-xl mx-auto">

    <header class="mb-10 flex justify-between items-end">
        <div>
            <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Primer Contacto</h1>
            <p class="text-indigo-600 font-bold text-xs uppercase tracking-widest">Panel de Prospección Ejecutiva</p>
        </div>
        <div class="text-right">
            <span id="counter" class="text-2xl font-black text-slate-300">00</span>
            <p class="text-[10px] font-bold text-slate-400 uppercase">Prospectos</p>
        </div>
    </header>

    <div class="bg-white p-6 rounded-3xl shadow-xl shadow-slate-200/50 mb-10 border border-white">
        <form id="contact-form" class="space-y-4">
            <input type="text" id="inst" placeholder="Institución / Empresa" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 font-semibold text-slate-700" required>
            
            <div class="grid grid-cols-2 gap-4">
                <input type="text" id="rep" placeholder="Responsable" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" required>
                <input type="tel" id="tel" placeholder="Teléfono" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 text-sm" required>
            </div>

            <select id="interes" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none font-bold text-slate-600 text-sm">
                <option value="Alto">Prioridad: Alta 🔥</option>
                <option value="Medio" selected>Prioridad: Media ⚡</option>
                <option value="Bajo">Prioridad: Baja ❄️</option>
            </select>

            <textarea id="notas" placeholder="Acuerdos clave y próximos pasos..." class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none h-24 text-sm"></textarea>

            <button type="submit" class="w-full btn-gradient text-white font-bold py-4 rounded-2xl shadow-lg shadow-indigo-200 active:scale-95 transition">
                Registrar en Pipeline
            </button>
        </form>
    </div>

    <div id="list-container" class="space-y-6">
        <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4">Pipeline Activo</h2>
    </div>

    <script>
        let prospectos = JSON.parse(localStorage.getItem('puebla_ejecutivo_v1')) || [];

        document.getElementById('contact-form').onsubmit = (e) => {
            e.preventDefault();
            const nuevo = {
                id: Date.now(),
                fecha_timestamp: Date.now(), // Para calcular la alerta
                inst: document.getElementById('inst').value,
                rep: document.getElementById('rep').value,
                tel: document.getElementById('tel').value,
                interes: document.getElementById('interes').value,
                notas: document.getElementById('notas').value
            };
            prospectos.unshift(nuevo);
            save();
            e.target.reset();
        };

        function calculateDays(timestamp) {
            const diff = Date.now() - timestamp;
            return Math.floor(diff / (1000 * 60 * 60 * 24));
        }

        function save() {
            localStorage.setItem('puebla_ejecutivo_v1', JSON.stringify(prospectos));
            render();
        }

        function eliminar(id) {
            if(confirm('¿Archivar prospecto?')) {
                prospectos = prospectos.filter(p => p.id !== id);
                save();
            }
        }

        function render() {
            const container = document.getElementById('list-container');
            document.getElementById('counter').innerText = prospectos.length.toString().padStart(2, '0');
            container.innerHTML = '<h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-4">Pipeline Activo</h2>';
            
            prospectos.forEach(p => {
                const dias = calculateDays(p.fecha_timestamp);
                const esCritico = dias >= 3;
                const badgeColor = p.interes === 'Alto' ? 'bg-red-500' : (p.interes === 'Medio' ? 'bg-amber-500' : 'bg-slate-400');

                container.innerHTML += `
                    <div class="executive-card p-6 ${esCritico ? 'card-alert' : ''}">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-lg font-extrabold text-slate-800 leading-tight">${p.inst}</h3>
                                <div class="flex items-center gap-2 mt-1 text-[10px] font-bold">
                                    <span class="${badgeColor} text-white px-2 py-0.5 rounded-full">${p.interes}</span>
                                    <span class="text-slate-400 uppercase italic">Hace ${dias} días</span>
                                </div>
                            </div>
                            <button onclick="eliminar(${p.id})" class="text-slate-300 hover:text-rose-500 transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </div>

                        ${esCritico ? `
                            <div class="mb-4 bg-rose-50 border border-rose-100 p-2 rounded-xl flex items-center gap-2">
                                <span class="animate-bounce">⚠️</span>
                                <span class="text-[10px] font-black text-rose-600 uppercase tracking-tighter">Atención: Requiere contacto inmediato</span>
                            </div>
                        ` : ''}

                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div class="text-xs">
                                <p class="text-slate-400 font-bold uppercase text-[9px]">Enlace</p>
                                <p class="font-bold text-slate-700">${p.rep}</p>
                            </div>
                            <div class="text-xs">
                                <p class="text-slate-400 font-bold uppercase text-[9px]">Contacto</p>
                                <a href="tel:${p.tel}" class="font-bold text-indigo-600 underline">${p.tel}</a>
                            </div>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-2xl">
                            <p class="text-[9px] font-bold text-slate-400 uppercase mb-1 italic">Últimos Acuerdos:</p>
                            <p class="text-xs text-slate-600 leading-relaxed">${p.notas || 'Sin comentarios registrados.'}</p>
                        </div>
                    </div>
                `;
            });
        }
        render();
    </script>
</body>
</html>
