<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Ejecutivo - Puebla Comparte</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .card-prospect { background: white; border-radius: 1.5rem; transition: all 0.3s; border: 1px solid #e2e8f0; position: relative; }
        .alert-warm { border-left: 8px solid #f59e0b; background: #fffcf5; }
        .alert-critical { border-left: 8px solid #ef4444; background: #fff5f5; animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0%, 100% { border-left-color: #ef4444; } 50% { border-left-color: #fca5a5; } }
        .status-badge { font-size: 0.6rem; font-weight: 800; padding: 3px 10px; border-radius: 50px; text-transform: uppercase; }
    </style>
</head>
<body class="p-4 md:p-8 max-w-2xl mx-auto pb-20">

    <header class="mb-8 flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-black text-slate-900 tracking-tighter">Pipeline Pro</h1>
            <p class="text-indigo-600 font-bold text-[10px] uppercase tracking-widest">Gestión de Alianzas</p>
        </div>
        <div class="flex gap-2">
            <button onclick="exportarDatos()" title="Guardar Respaldo Externo" class="p-3 bg-white border rounded-2xl shadow-sm hover:bg-indigo-50 hover:text-indigo-600 transition">💾</button>
            <button onclick="document.getElementById('fileInput').click()" title="Cargar Respaldo" class="p-3 bg-white border rounded-2xl shadow-sm hover:bg-emerald-50 hover:text-emerald-600 transition">📂</button>
            <input type="file" id="fileInput" class="hidden" accept=".json" onchange="importarDatos(event)">
            <div class="bg-slate-900 text-white px-4 py-2 rounded-2xl flex items-center shadow-lg">
                <span id="main-counter" class="text-xl font-black">0</span>
            </div>
        </div>
    </header>

    <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 mb-10">
        <form id="prospect-form" class="space-y-4">
            <input type="text" id="inst" placeholder="Institución / Empresa" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-indigo-500 font-bold" required>
            <div class="grid grid-cols-2 gap-3">
                <input type="text" id="rep" placeholder="Representante" class="p-4 bg-slate-50 border-none rounded-2xl outline-none text-sm">
                <input type="tel" id="tel" placeholder="WhatsApp / Tel" class="p-4 bg-slate-50 border-none rounded-2xl outline-none text-sm">
            </div>
            <textarea id="resena" placeholder="Reseña inicial (¿Cómo se consiguió el contacto?)" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none h-20 text-sm"></textarea>
            <button type="submit" class="w-full bg-indigo-600 text-white font-black py-4 rounded-2xl hover:bg-slate-900 transition-all shadow-xl">INICIAR PROSPECCIÓN</button>
        </form>
    </div>

    <div id="pipeline-list" class="space-y-6"></div>

    <script>
        const STAGES = ["Primer Contacto", "Primera Reunión", "Visita"];
        let db = JSON.parse(localStorage.getItem('puebla_pipeline_v2')) || [];

        // --- FUNCIONES DE RESPALDO (💾 y 📂) ---
        function exportarDatos() {
            if (db.length === 0) return alert("No hay datos para guardar.");
            const dataStr = JSON.stringify(db);
            const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
            const fileName = `Pipeline_Respaldo_${new Date().toLocaleDateString()}.json`;
            const link = document.createElement('a');
            link.setAttribute('href', dataUri);
            link.setAttribute('download', fileName);
            link.click();
        }

        function importarDatos(event) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (confirm("¿Cargar respaldo? Se borrará lo que esté en pantalla actualmente.")) {
                        db = imported;
                        save();
                    }
                } catch (err) { alert("Archivo de respaldo no válido."); }
            };
            reader.readAsText(event.target.files[0]);
        }

        // --- LÓGICA DE NEGOCIO ---
        document.getElementById('prospect-form').onsubmit = (e) => {
            e.preventDefault();
            const nuevo = {
                id: Date.now(),
                inst: document.getElementById('inst').value,
                rep: document.getElementById('rep').value,
                tel: document.getElementById('tel').value,
                stage: STAGES[0],
                lastUpdate: Date.now(),
                history: [document.getElementById('resena').value || "Contacto inicial."]
            };
            db.unshift(nuevo);
            save();
            e.target.reset();
        };

        function addNote(id) {
            const p = db.find(x => x.id === id);
            const note = prompt("Nueva reseña de seguimiento:");
            if(note) {
                p.history.unshift(note);
                p.lastUpdate = Date.now();
                save();
            }
        }

        function upgrade(id) {
            const p = db.find(x => x.id === id);
            const currIdx = STAGES.indexOf(p.stage);
            if (currIdx < STAGES.length - 1) {
                const note = prompt(`Mover a ${STAGES[currIdx+1]}. Añade una nota de avance:`);
                p.stage = STAGES[currIdx + 1];
                p.lastUpdate = Date.now();
                if(note) p.history.unshift(`[AVANCE A ${p.stage.toUpperCase()}] ${note}`);
                save();
            }
        }

        function remove(id) {
            if(confirm("¿Eliminar este prospecto definitivamente?")) {
                db = db.filter(x => x.id !== id);
                save();
            }
        }

        function save() {
            localStorage.setItem('puebla_pipeline_v2', JSON.stringify(db));
            render();
        }

        function render() {
            const list = document.getElementById('pipeline-list');
            document.getElementById('main-counter').innerText = db.length;
            list.innerHTML = "";

            db.forEach(p => {
                const dias = Math.floor((Date.now() - p.lastUpdate) / (1000*60*60*24));
                let alertClass = dias >= 5 ? "alert-critical" : (dias >= 3 ? "alert-warm" : "");
                const nextStage = STAGES[STAGES.indexOf(p.stage) + 1];

                list.innerHTML += `
                    <div class="card-prospect p-6 shadow-xl shadow-slate-200/50 ${alertClass} mb-6">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-black text-slate-900 leading-tight">${p.inst}</h3>
                                <div class="flex gap-2 mt-1">
                                    <span class="status-badge bg-indigo-100 text-indigo-700">${p.stage}</span>
                                    <span class="text-[10px] text-slate-400 font-bold uppercase mt-0.5">Hace ${dias} días</span>
                                </div>
                            </div>
                            <button onclick="remove(${p.id})" class="text-slate-300 hover:text-red-500 transition">✕</button>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mb-4">
                            <div class="bg-slate-50 p-3 rounded-xl">
                                <p class="text-[8px] font-black text-slate-400 uppercase">Representante</p>
                                <p class="text-xs font-bold text-slate-700">${p.rep || 'No asignado'}</p>
                            </div>
                            <a href="tel:${p.tel}" class="bg-emerald-50 p-3 rounded-xl border border-emerald-100 text-center">
                                <p class="text-[8px] font-black text-emerald-600 uppercase">WhatsApp / Tel</p>
                                <p class="text-xs font-bold text-emerald-700">${p.tel || 'Sin número'}</p>
                            </a>
                        </div>

                        <div class="bg-slate-50 p-4 rounded-2xl mb-4 max-h-32 overflow-y-auto border border-slate-100">
                            ${p.history.map(h => `<p class="text-[11px] text-slate-600 mb-2 border-b border-slate-200 pb-1 italic">"${h}"</p>`).join('')}
                        </div>

                        <div class="flex gap-2">
                            <button onclick="addNote(${p.id})" class="flex-1 bg-white border border-slate-200 text-slate-600 font-black py-3 rounded-xl text-[10px] uppercase">Añadir Reseña</button>
                            ${nextStage ? `
                                <button onclick="upgrade(${p.id})" class="flex-[2] bg-indigo-600 text-white font-black py-3 rounded-xl text-[10px] uppercase shadow-md shadow-indigo-100">Pasar a ${nextStage}</button>
                            ` : `
                                <div class="flex-[2] bg-emerald-500 text-white font-black py-3 rounded-xl text-[10px] uppercase text-center">¡Visita Completada!</div>
                            `}
                        </div>
                    </div>
                `;
            });
        }
        render();
    </script>
</body>
</html>
